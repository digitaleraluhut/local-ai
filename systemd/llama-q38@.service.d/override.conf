[Service]
; q38rocm fork lane: dedicated service + dedicated distrobox (container
; llama-q38, backend "rocm-q38"), so the qwen3.8-27b dual MTP/cache router
; runs isolated from the default router on :8080. Port pinned to 8090
; (the fork ignores `port` in preset INIs; q38-llama forwards it via CLI).
Environment=LLAMA_SERVER_PORT=8090
; models-max is a router CLI flag, not a valid INI key (it creates a spurious
; "default" model alias). Pin to 1 here so only one qwen3.8 variant is resident
; at a time (LRU eviction) — keeps total RAM under the 128 GB budget when
; qwen3.6-35b-a3b is also loaded on :8080.
ExecStart=%h/local-ai/q38-llama %i --models-max 1