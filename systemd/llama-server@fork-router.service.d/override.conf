[Service]
; q38rocm v1.5.2 engine drives this instance. A non-default LLAMA_SERVER_BIN
; makes the in-box launcher enable the fork env block (HSA_OVERRIDE=11.5.1,
; unified memory, RADV) and put the binary's dir on PATH. Port pinned to 8080,
; the canonical OpenAI API endpoint (the fork ignores `port` in preset INIs).
Environment=LLAMA_SERVER_BIN=/home/jaegle/opt/q38rocm/engine-v1.5.2/strix-halo-rocmfpx-engine/bin/llama-server
Environment=LLAMA_SERVER_PORT=8080
