name: CI

# Runs every test in the repo (pytest.ini: all test_*.py). No secrets.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: comfyui-bridge/requirements*.txt

      - run: pip install -r comfyui-bridge/requirements-dev.txt

      - name: Tests (pytest, all tests)
        run: python -m pytest
