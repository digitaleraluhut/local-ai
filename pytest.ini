[pytest]
# One rule: every test_*.py in the repo is run. Test modules import their
# sibling code (e.g. `from bridge import ...`), so each test directory is put on sys.path.
addopts = --import-mode=prepend
testpaths = .
norecursedirs = eval-venv eval-runs models node_modules .git .worktrees
asyncio_default_fixture_loop_scope = function
