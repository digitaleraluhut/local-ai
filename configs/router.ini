; llama.cpp router preset — serves multiple models from one llama-server.
; Section names ([qwen...]) become the model alias used in OpenAI API requests.
; Keys are llama-server CLI flags without leading dashes.
;
; On-demand memory model: only bge-m3 (tiny) loads at startup; the big
; models load on first request and the router evicts the least recently
; used one beyond models-max. Expect a ~40-60 s cold load per swap.

version = 1

; Global defaults are intentionally minimal: the router cascades [*] onto
; ALL known models (including any cached HF models), so anything specific
; to our workflow (load-on-startup, embeddings, jinja) MUST live per-section.
[*]
ngl = 999
b = 2048
ub = 2048
no-mmap = true
metrics = true

; Fast general chat / subagent lane. MoE: ~3B active params, ~60 tok/s class.
[qwen3.6-35b-a3b]
model = /path/to/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-Q8_K_XL.gguf
c = 262144
t = 8
parallel = 2
kv-unified = true
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
jinja = true
load-on-startup = true

; Dense coding model for interactive agentic work. Prompt caching keeps
; tool-round-trips warm; draft-mtp omitted (adds nothing on ROCm backend).
[qwen3.8-27b]
model = /path/to/models/qwen3.8-27b/stock/Qwen3.8-27B-UD-Q4_K_XL.gguf
c = 131072
t = 16
parallel = 1
kv-unified = true
flash-attn = on
cache-prompt = true
ctx-checkpoints = 16
cram = 16384
jinja = true
reasoning = off
load-on-startup = false

; 1024-dim multilingual (German + English) embedder for LobeHub RAG.
; CLS pooling, no query prefix required.
[bge-m3]
model = /path/to/models/bge-m3/bge-m3-Q8_0.gguf
c = 8192
b = 8192
ub = 8192
t = 4
embeddings = true
pooling = cls
load-on-startup = true
