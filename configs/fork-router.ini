; PRIMARY SERVING on this host — the q38rocm v1.5.2 fork router on :8080.
; qwen3.8-27b-fp4 (upstream "cache" profile: prompt caching on, MTP off,
; ~300 tok/s prefill, repeat-request TTFT ~0.09s via context checkpoints) +
; bge-m3 embeddings. Started via: systemctl --user start llama-server@fork-router
; (the unit's drop-in sets LLAMA_SERVER_BIN to the fork engine and port 8080).
;
; Memory: 262144 ctx ≈ 33.6 GB resident claimed (KV is q8_0/q8_0, VMA is
; lazy); measured ~35 GB realized alongside bge-m3. Lower c to 131072 to
; halve the KV footprint. Both models load at startup; the router main
; answers immediately while children load in the background.
;
; MTP REMOVED 2026-08-29: the fork's run_server.sh forbids MTP + prompt
; caching in one config. MTP+cache coexists only via the v1.5.0+ patch, and
; even then divergent prompt tails "gracefully fall back to cold prefill"
; (spec-boundary-mismatch), which reprocesses the whole context at ~40 tok/s
; because strict-MTP boundary-safe multi-row verification runs during prefill.
; The task name qwen3.8-27b-fp4-mtp is kept for client compat; MTP is OFF.

version = 1

[qwen3.8-27b-fp4-mtp]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = q8_0
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
; Prompt caching — upstream q38rocm "cache" profile for 128 GB.
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cpent = 4096
cram = 32768
slot-save-path = /path/to/models/qwen3.8-27b/slots
reasoning = off
jinja = true
metrics = true
load-on-startup = true

[bge-m3]
model = /path/to/models/bge-m3/bge-m3-Q8_0.gguf
c = 8192
b = 8192
ub = 8192
t = 4
embeddings = true
pooling = cls
load-on-startup = true