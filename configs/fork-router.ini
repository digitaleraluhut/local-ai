; PRIMARY SERVING on this host — the q38rocm v1.5.2 fork router on :8080.
; qwen3.8-27b-fp4 (strict MTP + prompt caching, ~28 tok/s decode) + bge-m3
; embeddings. Started via: systemctl --user start llama-server@fork-router
; (the unit's drop-in sets LLAMA_SERVER_BIN to the fork engine and port 8080).
;
; Memory: 262144 ctx ≈ 33.6 GB resident claimed (KV is q8_0/turbo4, VMA is
; lazy); measured ~35 GB realized alongside bge-m3. Lower c to 131072 to
; halve the KV footprint. Both models load at startup; the router main
; answers immediately while children load in the background.

version = 1

[qwen3.8-27b-fp4-mtp]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
spec-type = draft-mtp
spec-mtp-strict-qwen = true
spec-draft-n-max = 4
spec-draft-p-min = 0.0
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = turbo4
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cpent = 4096
cram = 32768
reasoning = off
jinja = true
metrics = true
load-on-startup = true

[bge-m3]
model = /path/to/models/bge-m3/bge-m3-Q8_0.gguf
c = 8192
b = 8192
ub = 8192
t = 4
embeddings = true
pooling = cls
load-on-startup = true