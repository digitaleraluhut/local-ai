; Qwen3.8-27B ROCmFP4_FAST via the julianmb/q38rocm engine (ROCmFPX fork).
; Requires: scripts/download-q38rocm-engine.sh + launch via q38-llama
; (sets LLAMA_SERVER_BIN and the q38rocm env inside the distrobox).
;
; Cache-mode profile (upstream "cache"): prompt caching on, MTP off.
; Measured on 128 GB Strix Halo: prefill ~300 tok/s, decode ~14 tok/s,
; repeat-request TTFT 13.3 s -> 0.09 s via context checkpoints,
; byte-identical outputs across cold and cache-restored runs.
;
; draft-MTP was benchmarked at 27-38 tok/s decode but is mutually
; exclusive with prompt caching in this engine: any speculation boundary
; forces a full cold re-prefill ("prompt cache cold fallback: reason=
; spec-boundary-mismatch"), and non-strict MTP showed run-to-run output
; divergence at temperature 0 with a fixed seed. Keep it disabled for
; agentic workloads; see git history if you want to re-enable for
; throwaway batch generation.
version = 1

; NOTE: this fork ignores `port`/`host` in preset INIs — q38-llama passes
; them via CLI instead (override with LLAMA_SERVER_PORT).

[qwen3.8-27b-fp4]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = turbo4
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
; Prompt caching — upstream q38rocm "cache" profile values for 128 GB.
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cpent = 4096
cram = 32768
slot-save-path = /path/to/models/qwen3.8-27b/slots
reasoning = off
jinja = true
metrics = true
load-on-startup = true
