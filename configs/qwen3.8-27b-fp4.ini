; Qwen3.8-27B ROCmFP4_FAST via the julianmb/q38rocm engine (ROCmFPX fork).
; Requires: scripts/download-q38rocm-engine.sh + launch via q38-llama
; (sets LLAMA_SERVER_BIN and the q38rocm env inside the distrobox).
;
; Mirrors the upstream "agent" profile: strict greedy MTP, TurboQuant KV,
; Vulkan RADV Wave64. MTP heads are embedded in the GGUF — no draft file.
version = 1

; NOTE: this fork ignores `port`/`host` in preset INIs — q38-llama passes
; them via CLI instead (override with LLAMA_SERVER_PORT).

[qwen3.8-27b-fp4]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
spec-type = draft-mtp
spec-mtp-strict-qwen = true
spec-draft-n-max = 4
spec-draft-p-min = 0.0
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = turbo4
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
ctxcp = 0
cram = 0
no-cache-prompt = true
no-cache-idle-slots = true
reasoning = off
jinja = true
metrics = true
load-on-startup = true
