; Qwen3.8-27B ROCmFP4_FAST — BOTH speculation mode (speed/agent profile) AND
; cache mode (cache profile) behind one router, exposed as two model aliases on
; the SAME port. Pick per request via the OpenAI "model" field:
;   - "qwen3.8-27b-fp4-mtp"   -> draft-MTP speculation, prompt caching OFF
;                                 (MTP + cache are mutually exclusive in this
;                                  engine; caching across slots would otherwise
;                                  force spec-boundary-mismatch cold prefills)
;   - "qwen3.8-27b-fp4-cache" -> no speculation, RAM-aware context checkpoints,
;                                 q8_0/q8_0 KV (upstream "cache" profile)
;
; Upstream profile mapping (julianmb/q38rocm run_server.sh v1.5.2):
;   speed: MTP(n=4,non-strict) + cache OFF*   agent: MTP(strict) + cache OFF
;   cache: MTP OFF + RAM checkpoints          safe:  both OFF
; (*v1.5.2 speed enables cache too, but local measurements on this host showed
;  ways MTP+cache degrade to ~40 tok/s cold refills + output divergence at
;  temp 0; we keep the two lanes strictly separated for a clean A/B.)
;
; Router keeps only ONE alias resident (models-max = 1) with LRU eviction: the
; two 27B lanes never share RAM simultaneously.
;
; Requires: scripts/download-q38rocm-engine.sh + launch via q38-llama, which
; sets LLAMA_SERVER_BIN and the q38rocm env inside a dedicated distrobox
; (backend "rocm-q38" -> container llama-q38). The fork ignores `port`/`host`
; in preset INIs — q38-llama passes --port via LLAMA_SERVER_PORT on the CLI.
version = 1

; NOTE: models-max is NOT a valid top-level INI key; the router creates a
; spurious "default" model alias from it. Pass --models-max via CLI instead
; (see systemd drop-in: systemd/llama-q38@.service.d/override.conf).

; --- Speculation lane (upstream speed/agent profile) ------------------------
; MTP strict-Qwen for deterministic outputs at temp 0. Prompt caching fully
; disabled (-ctxcp/-cram absent => 0): the speed lane is a cold-prefill lane,
; its wins come from 27-38 tok/s speculative decode on long generations.
[qwen3.8-27b-fp4-mtp]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
spec-type = draft-mtp
spec-mtp-strict-qwen = true
spec-draft-n-max = 4
spec-draft-p-min = 0.0
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = turbo4
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
reasoning = off
jinja = true
metrics = true
load-on-startup = false

; --- Cache lane (upstream "cache" profile) -----------------------------------
; No speculation; q8_0/q8_0 KV (TurboQuant rotation is incompatible with
; checkpoint restore). RAM-aware checkpoints give sub-100 ms warm turns and
; byte-identical restores (measured: 13.3 s cold -> 0.09 s repeat).
[qwen3.8-27b-fp4-cache]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = q8_0
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cpent = 4096
cram = 32768
slot-save-path = /path/to/models/qwen3.8-27b/slots
reasoning = off
jinja = true
metrics = true
load-on-startup = false