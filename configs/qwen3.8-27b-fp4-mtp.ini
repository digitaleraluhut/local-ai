; q38rocm v1.5.2 engine: single-lane qwen3.8-27b-fp4 with strict-Qwen MTP +
; prompt caching. For a standalone fork instance (e.g. a temporarily higher
; ctx on its own port) via LLAMA_SERVER_BIN override; the DEFAULT serving on
; this host is the multi-model fork-router.ini under
;   systemctl --user start llama-server@fork-router   (port 8080)
;
; Caching values = upstream "cache" profile for 128 GB.

version = 1

[qwen3.8-27b-fp4-mtp]
model = /path/to/models/qwen3.8-27b/Qwen3.8-27B-ROCmFP4-FAST.gguf
spec-type = draft-mtp
spec-mtp-strict-qwen = true
spec-draft-n-max = 4
spec-draft-p-min = 0.0
device = Vulkan0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
ctk = q8_0
ctv = turbo4
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cpent = 4096
cram = 32768
reasoning = off
jinja = true
metrics = true
load-on-startup = true