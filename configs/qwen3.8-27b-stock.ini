; Qwen3.8-27B via STOCK llama.cpp (kyuz0 rocm-7.14 toolbox build b10580+),
; side-by-side evaluation against qwen3.8-27b-fp4 (q38rocm ROCmFPX fork).
;
; Weights: unsloth UD-Q4_K_XL (17.56 GB, dynamic quant) + ggml-org MTP
; head Q8_0 as draft. Fetch with:
;   curl -L -o <MODELS_DIR>/stock/Qwen3.8-27B-UD-Q4_K_XL.gguf \
;     https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf
;   curl -L -o <MODELS_DIR>/stock/mtp-Qwen3.8-27B-Q8_0.gguf \
;     https://huggingface.co/ggml-org/Qwen3.8-27B-GGUF/resolve/main/mtp-Qwen3.8-27B-Q8_0.gguf
;
; Same caching block as fp4 preset minus cpent (upstream has no
; per-token checkpoint interval — fork-only feature).
; Runs on the default HIP/ROCm device of the rocm backend.
version = 1

; NOTE: this fork ignores `port`/`host` in preset INIs — pass a port via
; LLAMA_SERVER_PORT when launching (e.g. LLAMA_SERVER_PORT=8012).

[qwen3.8-27b-stock]
model = /path/to/models/qwen3.8-27b/stock/Qwen3.8-27B-UD-Q4_K_XL.gguf
model-draft = /path/to/models/qwen3.8-27b/stock/mtp-Qwen3.8-27B-Q8_0.gguf
spec-type = draft-mtp
spec-draft-n-max = 4
spec-draft-p-min = 0.0
c = 262144
parallel = 1
ngl = 999
flash-attn = on
b = 2048
ub = 1024
t = 16
poll = 100
no-mmap = true
cont-batching = true
kv-unified = true
cache-prompt = true
cache-reuse = 256
ctxcp = 16
cram = 32768
reasoning = off
jinja = true
metrics = true
load-on-startup = true
