# Model catalog: every model file a preset in configs/ loads.
#
# Adding a model = one PR: add an entry here and a preset in configs/.
# `scripts/model_catalog.py check` (CI) validates this file against the
# presets and the memory budget; `localai-model-sync` on the host downloads
# the files (never deletes).
#
# Fill sha256/size from the Hugging Face file listing (LFS oid), e.g.
#   curl -s https://huggingface.co/api/models/<repo>/tree/main?recursive=1
# `path` is relative to the models dir (/srv/localai/models) and is what the
# presets reference as /path/to/models/<path>.

# Unified memory shared with the cluster is ~109 GiB; presets must leave room.
budget_gib: 100

# Presets that run behind a router with a limit on simultaneously loaded
# models (--models-max). Models with load-on-startup = true always count.
# Presets not listed here are assumed to keep every section loaded.
presets:
  router.ini: {max_loaded: 2}
  qwen3.8-dual.ini: {max_loaded: 1}

